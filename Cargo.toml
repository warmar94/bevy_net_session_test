[package]
name = "bevy_net_session_test"
version = "0.1.0"
edition = "2021"
# Bevy 0.20's own minimum.
rust-version = "1.97.1"
description = "Multiplayer tests without a second machine: host, join and play a real bevy_net_session over UDP loopback, inside one `cargo test`. Built on bevy_headless_test."
license = "MIT OR Apache-2.0"
repository = "https://github.com/warmar94/bevy_net_session_test"
readme = "README.md"
keywords = ["bevy", "testing", "multiplayer", "networking", "replicon"]
categories = ["game-development", "development-tools::testing", "network-programming"]
# Not part of the published package.
exclude = ["NOTES.md", "docs/", "/target"]

# Bevy is pinned EXACTLY and only its sub-crates are used, without default features: the crate adds
# no Bevy feature a game did not ask for, and a game on Bevy 0.20.0 ends up with ONE Bevy.
[dependencies]
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std"] }
# The strict headless app, replicon's test builder and its allow-list.
# TEMPORARY path dependency until bevy_headless_test 0.2.0 is on crates.io.
bevy_headless_test = { version = "0.2.0", path = "../bevy_headless_test", default-features = false, features = ["replicon"] }
# The session layer under test, over its UDP transport. A game's own `steam` feature still unifies in.
# TEMPORARY path dependency: bevy_net_session 0.2 (Bevy 0.20) waits on bevy_replicon_renet's
# crates.io release.
bevy_net_session = { version = "0.2.0", path = "../bevy_net_session", default-features = false, features = ["ip"] }

[dev-dependencies]
# Tests: the prelude, headless.
bevy = { version = "=0.20.0", default-features = false, features = ["std", "bevy_state"] }
serde = { version = "1", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
